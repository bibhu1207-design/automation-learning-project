<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lead Capture & Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 30px;
            color: #1f2937;
        }

        .subtitle {
            margin: 0 0 30px;
            color: #6b7280;
            font-size: 15px;
            line-height: 1.5;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 18px;
            color: #111827;
        }

        label {
            display: block;
            margin-bottom: 7px;
            margin-top: 18px;
            font-size: 14px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #4f46e5;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }

        button {
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }

        .submit-btn {
            flex: 1;
            border: none;
            background: #4f46e5;
            color: white;
        }

        .submit-btn:hover {
            background: #4338ca;
        }

        .clear-btn {
            border: 1px solid #d1d5db;
            background: white;
            color: #374151;
        }

        .clear-btn:hover {
            background: #f9fafb;
        }

        #result {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
        }

        .success {
            display: block !important;
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .error {
            display: block !important;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .workflow {
            margin-top: 25px;
            padding-top: 22px;
            border-top: 1px solid #e5e7eb;
        }

        .workflow-title {
            font-size: 14px;
            font-weight: bold;
            color: #374151;
            margin-bottom: 12px;
        }

        .workflow-steps {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            font-size: 12px;
            color: #6b7280;
            text-align: center;
        }

        .step {
            flex: 1;
            padding: 10px 5px;
            background: #f9fafb;
            border-radius: 8px;
        }

        .footer {
            text-align: center;
            margin-top: 16px;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Lead Capture & Management</h1>

            <p class="subtitle">
                Capture customer enquiries and store them in your business workflow.
            </p>

            <div class="section-title">
                New Lead
            </div>

            <form id="leadForm">

                <label for="name">Customer Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter customer name"
                    required
                >

                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter phone number"
                    required
                >

                <div class="buttons">

                    <button
                        type="submit"
                        class="submit-btn"
                    >
                        Submit Lead
                    </button>

                    <button
                        type="button"
                        class="clear-btn"
                        id="clearBtn"
                    >
                        Clear
                    </button>

                </div>

            </form>

            <div id="result"></div>
 
              

        </div>

        <div class="footer">
        
        </div>

    </div>

    <script>
        const form = document.getElementById("leadForm");
        const result = document.getElementById("result");
        const clearBtn = document.getElementById("clearBtn");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const phone = document.getElementById("phone").value.trim();

            const eventId = crypto.randomUUID();

            result.className = "";
            result.style.display = "none";
            result.textContent = "Submitting lead...";

            try {

                const response = await fetch("/lead", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        event_id: eventId,
                        name: name,
                        phone: phone
                    })
                });

                const data = await response.json();

                if (response.ok) {

                    result.textContent = "✓ Lead received successfully";
                    result.className = "success";

                    form.reset();

                } else {

                    result.textContent = data.error || "Unable to submit lead.";
                    result.className = "error";

                }

            } catch (error) {

                result.textContent = "Could not connect to the server.";
                result.className = "error";

                console.error(error);

            }

        });

        clearBtn.addEventListener("click", function() {

            form.reset();

            result.textContent = "";
            result.className = "";
            result.style.display = "none";

        });
    </script>

</body>
</html>
